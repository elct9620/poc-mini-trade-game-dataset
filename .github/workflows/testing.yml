name: Tests and Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests and Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Validate splits
      run: |
        bundle exec ruby bin/validate train.csv
        bundle exec ruby bin/validate validation.csv
        bundle exec ruby bin/validate test.csv
